<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official support website for SimonLin's products and services.">
    <meta name="theme-color" content="#0a84ff">
    <meta property="og:title" content="SimonLin's Support">
    <meta property="og:description" content="Official Support Website">
    <meta property="og:type" content="website">
    <title>SimonLin's Support</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --text: #1d1d1f;
            --text-muted: #6e6e73;
            --accent: #0a84ff;
            --accent-hover: #0070e0;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            --radius: 18px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --surface: #1c1c1e;
                --text: #f5f5f7;
                --text-muted: #a1a1a6;
                --accent: #0a84ff;
                --accent-hover: #409cff;
                --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            }
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        main {
            background: var(--surface);
            padding: clamp(32px, 6vw, 56px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        p {
            margin: 0 0 32px;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 999px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .button:hover,
        .button:focus-visible {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <main>
        <h1>SimonLin's Lab</h1>
        <p>Email: simonlin2003@gmail.com</p>
        <a class="button" href="https://sites.google.com/view/simonlin2003/home"
           target="_blank" rel="noopener noreferrer">
            Open Support Page
        </a>
    </main>
</body>
</html>
